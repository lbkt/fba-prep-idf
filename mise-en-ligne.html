<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mise en ligne ASIN — FBA PREP IDF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body data-section="fba-miseenligne">
<script>
/* GARDE D'ACCÈS — vérifie la permission avant d'afficher la page. */
(function(){
  const REQUIRED = document.body.getAttribute('data-section');
  if (!REQUIRED) return;
  document.documentElement.style.visibility = 'hidden';
  async function ghF(p){ return fetch('/api/'+p,{headers:{'Accept':'application/vnd.github.v3+json'}}); }
  function b64u(b){ const r=atob((b||'').replace(/\n/g,'')); return new TextDecoder('utf-8').decode(Uint8Array.from(r,c=>c.charCodeAt(0))); }
  (async function(){
    let email='', perms={};
    try { const w=await fetch('/api/whoami').then(r=>r.json()); email=(w.email||'').toLowerCase(); } catch(e){}
    try { const r=await ghF('contents/permissions.json'); if(r.ok){ perms=JSON.parse(b64u((await r.json()).content)); } } catch(e){}
    const me = perms[email];
    const acces = (me && me.acces) || [];
    const isAdmin = !!(me && me.admin);
    const allowed = acces.includes(REQUIRED) || (REQUIRED === 'admin' && isAdmin) || (isAdmin && REQUIRED !== 'admin');
    if (allowed) {
      document.documentElement.style.visibility = '';
    } else {
      document.documentElement.style.visibility = '';
      document.body.innerHTML = '<div style="font-family:Inter,-apple-system,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0B1120;color:#EEF2FA;text-align:center;padding:20px"><div><div style="font-size:56px;margin-bottom:20px">🔒</div><div style="font-size:22px;font-weight:800;margin-bottom:10px">Accès non autorisé</div><div style="color:#95A2BC;font-size:14px;margin-bottom:24px;line-height:1.6">Vous n\'avez pas la permission d\'accéder à cette page.<br>Connecté en tant que : '+(email||'inconnu')+'</div><a href="index.html" style="display:inline-block;padding:12px 26px;background:linear-gradient(135deg,#3B82F6,#8B5CF6);color:#fff;text-decoration:none;border-radius:11px;font-size:13px;font-weight:700">Retour à l\'accueil</a></div></div>';
    }
  })();
})();
</script>

<style>
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --line:#E3E8F0; --line2:#D1D9E6;
  --navy:#152238; --amber:#F5B301; --amber-dark:#D89A00;
  --txt:#152238; --muted:#5A6B85; --dim:#8A97AD;
  --green:#0F7A4E; --red:#B23434;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,-apple-system,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
.wrap{max-width:960px;margin:0 auto;padding:26px 20px 60px}
.top{display:flex;align-items:center;gap:14px;margin-bottom:24px}
.back{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border:1px solid var(--line2);border-radius:10px;background:var(--surface);color:var(--muted);text-decoration:none;font-size:13px;font-weight:600}
.back:hover{color:var(--navy);border-color:var(--amber)}
h1{font-size:26px;font-weight:800;margin:0;letter-spacing:-.02em;color:var(--navy)}
h1 .g{color:var(--amber-dark)}
.sub{color:var(--muted);font-size:13.5px;margin-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:20px;box-shadow:0 6px 24px rgba(21,34,56,.06)}
.seg{display:inline-flex;background:#EEF1F6;border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;margin-bottom:22px}
.seg button{border:0;background:transparent;color:var(--muted);font-family:inherit;font-weight:700;font-size:13.5px;padding:9px 18px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--navy);color:#fff}
.seg button:disabled{opacity:.5;cursor:not-allowed}
.seg .soon{font-size:10px;font-weight:800;background:var(--amber);color:#3a2a00;border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:middle}
label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:7px;text-transform:uppercase;letter-spacing:.04em}
.field{margin-bottom:18px}
input[type=text],input[type=number]{width:100%;background:#fff;border:1px solid var(--line2);border-radius:11px;color:var(--txt);font-family:inherit;font-size:15px;padding:13px 15px;outline:none}
input:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(245,179,1,.20)}
.row{display:grid;grid-template-columns:1fr 160px;gap:16px}
@media(max-width:560px){.row{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:9px;margin:2px 0 20px}
.chip{display:inline-flex;align-items:center;gap:7px;background:#F4F6FA;border:1px solid var(--line);border-radius:10px;padding:8px 13px;font-size:12.5px;color:var(--muted);font-weight:600}
.chip b{color:var(--navy);font-weight:700}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.btn{width:100%;border:0;border-radius:12px;background:var(--amber);color:var(--navy);font-family:inherit;font-weight:800;font-size:15px;padding:15px;cursor:pointer;letter-spacing:.01em}
.btn:hover{background:var(--amber-dark)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.msg{margin-top:14px;font-size:13.5px;padding:12px 14px;border-radius:10px;display:none}
.msg.ok{display:block;background:#DCF5E9;border:1px solid #A9E4C7;color:#0F5C3B}
.msg.err{display:block;background:#FBE0E0;border:1px solid #F1B4B4;color:#8f2a2a}
.qtitle{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.qtitle h2{font-size:16px;font-weight:800;margin:0;color:var(--navy)}
.refresh{background:var(--surface);border:1px solid var(--line2);color:var(--muted);border-radius:9px;padding:7px 12px;font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--dim);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:0 10px 10px;border-bottom:1px solid var(--line)}
td{padding:12px 10px;border-bottom:1px solid var(--line);color:var(--txt)}
td.asin{font-family:ui-monospace,Menlo,monospace;font-weight:700}
.badge{display:inline-block;font-size:11px;font-weight:800;padding:4px 9px;border-radius:7px}
.b-wait{background:#FEF3D0;color:#8a6a00}
.b-ok{background:#DCF5E9;color:#0F7A4E}
.b-err{background:#FBE0E0;color:#B23434}
.empty{color:var(--dim);text-align:center;padding:26px 0;font-size:13.5px}
</style>

<div class="wrap">
  <div class="top"><a class="back" href="fba.html">← Console FBA PREP IDF</a></div>
  <h1>Mise en ligne <span class="g">ASIN</span></h1>
  <div class="sub">Ajoute un ASIN à la file : le moteur crée l'offre sur Amazon automatiquement.</div>

  <div class="card" style="margin-top:22px">
    <div class="seg" id="seg">
      <button data-canal="FBA" class="on">FBA</button>
      <button data-canal="FBM" disabled>FBM <span class="soon">bientôt</span></button>
    </div>

    <div class="row">
      <div class="field">
        <label>ASIN</label>
        <input type="text" id="asin" maxlength="10" placeholder="ex. B0BVR2KPNV" autocomplete="off" spellcheck="false">
      </div>
      <div class="field">
        <label>Quantité</label>
        <input type="number" id="qte" min="1" step="1" placeholder="ex. 10">
      </div>
    </div>

    <div class="chips">
      <span class="chip"><span class="dot"></span>Canal : <b id="c-canal">FBA</b></span>
      <span class="chip"><span class="dot"></span>État : <b>Neuf</b></span>
      <span class="chip"><span class="dot"></span>Piles / batterie : <b>Non</b></span>
      <span class="chip"><span class="dot"></span>Marchandises dangereuses : <b>Non applicable</b></span>
    </div>

    <button class="btn" id="add">Ajouter à la file</button>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card">
    <div class="qtitle">
      <h2>File d'attente &amp; journal</h2>
      <button class="refresh" id="refresh">↻ Rafraîchir</button>
    </div>
    <div id="tablewrap"><div class="empty">Chargement…</div></div>
  </div>
</div>

<script>
const QUEUE_PATH = 'mise-en-ligne-queue.json';
let CANAL = 'FBA';
let ME = '';

async function ghFetch(path, opts={}) {
  return fetch(`/api/${path}`, { ...opts, headers:{ 'Accept':'application/vnd.github.v3+json','Content-Type':'application/json',...(opts.headers||{}) } });
}
function b64utf8(b64){ const raw=atob((b64||'').replace(/\n/g,'')); const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0)); return new TextDecoder('utf-8').decode(bytes); }
async function putJson(path, obj, sha, msg){
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(obj,null,2))));
  const body={message:msg,content}; if(sha) body.sha=sha;
  const res = await ghFetch(`contents/${path}`,{method:'PUT',body:JSON.stringify(body)});
  if(res.ok){ const d=await res.json(); return d.content.sha; }
  throw new Error('Écriture GitHub échouée ('+res.status+')');
}
async function loadQueue(){
  const r = await ghFetch(`contents/${QUEUE_PATH}`);
  if(r.status===404) return { data:{entries:[]}, sha:null };
  if(!r.ok) throw new Error('Lecture file échouée ('+r.status+')');
  const j = await r.json();
  const data = JSON.parse(b64utf8(j.content) || '{"entries":[]}');
  if(!Array.isArray(data.entries)) data.entries=[];
  return { data, sha:j.sha };
}

document.getElementById('seg').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b || b.disabled) return;
  document.querySelectorAll('#seg button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); CANAL = b.dataset.canal;
  document.getElementById('c-canal').textContent = CANAL;
});

function showMsg(txt, ok){
  const m=document.getElementById('msg');
  m.className='msg '+(ok?'ok':'err'); m.textContent=txt;
}

document.getElementById('add').addEventListener('click', addEntry);
document.getElementById('asin').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('qte').focus(); });
document.getElementById('qte').addEventListener('keydown', e=>{ if(e.key==='Enter') addEntry(); });

async function addEntry(){
  const btn=document.getElementById('add');
  const asin=(document.getElementById('asin').value||'').trim().toUpperCase();
  const qte=parseInt(document.getElementById('qte').value,10);
  if(!/^[A-Z0-9]{10}$/.test(asin)){ showMsg('ASIN invalide : 10 caractères (ex. B0BVR2KPNV).', false); return; }
  if(!qte || qte<1){ showMsg('Indique une quantité valide (≥ 1).', false); return; }
  btn.disabled=true; btn.textContent='Ajout…';
  try{
    const {data,sha} = await loadQueue();
    data.entries.push({
      id: Date.now().toString(36)+Math.random().toString(36).slice(2,6),
      asin, canal:CANAL, quantite:qte, etat:'Neuf', piles:'Non', dangereux:'Non applicable',
      ajoutePar: ME||'inconnu', ajouteLe: new Date().toISOString(),
      statut:'en_attente', traiteLe:null, resultat:''
    });
    await putJson(QUEUE_PATH, data, sha, 'Ajout ASIN '+asin+' ('+CANAL+' x'+qte+') a la file');
    document.getElementById('asin').value=''; document.getElementById('qte').value='';
    document.getElementById('asin').focus();
    showMsg('ASIN '+asin+' ajouté à la file. Le moteur le traitera au prochain passage.', true);
    render();
  }catch(err){ showMsg('Erreur : '+err.message, false); }
  finally{ btn.disabled=false; btn.textContent='Ajouter à la file'; }
}

function fmt(iso){ if(!iso) return '—'; const d=new Date(iso); return d.toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); }
function badge(s){
  if(s==='en_ligne') return '<span class="badge b-ok">En ligne</span>';
  if(s==='erreur')   return '<span class="badge b-err">Erreur</span>';
  return '<span class="badge b-wait">En attente</span>';
}
async function render(){
  const wrap=document.getElementById('tablewrap');
  try{
    const {data}=await loadQueue();
    const rows=[...data.entries].reverse();
    if(!rows.length){ wrap.innerHTML='<div class="empty">Aucun ASIN pour le moment.</div>'; return; }
    wrap.innerHTML='<table><thead><tr><th>ASIN</th><th>Canal</th><th>Qté</th><th>Ajouté</th><th>Statut</th><th>Détail</th></tr></thead><tbody>'+
      rows.map(e=>`<tr><td class="asin">${e.asin}</td><td>${e.canal}</td><td>${e.quantite}</td><td>${fmt(e.ajouteLe)}</td><td>${badge(e.statut)}</td><td style="color:var(--muted)">${(e.resultat||'').replace(/</g,'&lt;')||'—'}</td></tr>`).join('')+
      '</tbody></table>';
  }catch(err){ wrap.innerHTML='<div class="empty">Impossible de charger la file : '+err.message+'</div>'; }
}
document.getElementById('refresh').addEventListener('click', render);

(async function init(){
  try{ const w=await fetch('/api/whoami').then(r=>r.json()); ME=(w.email||'').toLowerCase(); }catch(e){}
  render();
  setInterval(render, 20000);
})();
</script>
</body>
</html>
