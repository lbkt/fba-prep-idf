<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suivi des mises en ligne — FBA PREP IDF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body data-section="fba-suivi-miseenligne">
<script>
/* GARDE D'ACCÈS — vérifie la permission avant d'afficher la page. */
(function(){
  const REQUIRED = document.body.getAttribute('data-section');
  if (!REQUIRED) return;
  document.documentElement.style.visibility = 'hidden';
  async function ghF(p){ return fetch('/api/'+p,{headers:{'Accept':'application/vnd.github.v3+json'}}); }
  function b64u(b){ const r=atob((b||'').replace(/\n/g,'')); return new TextDecoder('utf-8').decode(Uint8Array.from(r,c=>c.charCodeAt(0))); }
  (async function(){
    let email='', perms={};
    try { const w=await fetch('/api/whoami').then(r=>r.json()); email=(w.email||'').toLowerCase(); } catch(e){}
    try { const r=await ghF('contents/permissions.json'); if(r.ok){ perms=JSON.parse(b64u((await r.json()).content)); } } catch(e){}
    const me = perms[email];
    const acces = (me && me.acces) || [];
    const isAdmin = !!(me && me.admin);
    const allowed = acces.includes(REQUIRED) || (REQUIRED === 'admin' && isAdmin) || (isAdmin && REQUIRED !== 'admin');
    if (allowed) {
      document.documentElement.style.visibility = '';
    } else {
      document.documentElement.style.visibility = '';
      document.body.innerHTML = '<div style="font-family:Inter,-apple-system,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0B1120;color:#EEF2FA;text-align:center;padding:20px"><div><div style="font-size:56px;margin-bottom:20px">🔒</div><div style="font-size:22px;font-weight:800;margin-bottom:10px">Accès non autorisé</div><div style="color:#95A2BC;font-size:14px;margin-bottom:24px;line-height:1.6">Vous n\'avez pas la permission d\'accéder à cette page.<br>Connecté en tant que : '+(email||'inconnu')+'</div><a href="index.html" style="display:inline-block;padding:12px 26px;background:linear-gradient(135deg,#3B82F6,#8B5CF6);color:#fff;text-decoration:none;border-radius:11px;font-size:13px;font-weight:700">Retour à l\'accueil</a></div></div>';
    }
  })();
})();
</script>

<style>
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --line:#E3E8F0; --line2:#D1D9E6;
  --navy:#152238; --amber:#F5B301; --amber-dark:#D89A00;
  --txt:#152238; --muted:#5A6B85; --dim:#8A97AD;
  --green:#0F7A4E; --red:#B23434;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,-apple-system,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
.wrap{max-width:1040px;margin:0 auto;padding:26px 20px 60px}
.top{display:flex;align-items:center;gap:14px;margin-bottom:24px}
.back{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border:1px solid var(--line2);border-radius:10px;background:var(--surface);color:var(--muted);text-decoration:none;font-size:13px;font-weight:600}
.back:hover{color:var(--navy);border-color:var(--amber)}
h1{font-size:26px;font-weight:800;margin:0;letter-spacing:-.02em;color:var(--navy)}
h1 .g{color:var(--amber-dark)}
.sub{color:var(--muted);font-size:13.5px;margin-top:4px}
.stats{display:flex;gap:14px;flex-wrap:wrap;margin:22px 0}
.stat{flex:1;min-width:150px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:0 6px 24px rgba(21,34,56,.06)}
.stat .n{font-size:26px;font-weight:800;color:var(--navy)}
.stat .l{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
.stat.ok .n{color:var(--green)} .stat.wait .n{color:var(--amber-dark)} .stat.err .n{color:var(--red)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 6px 24px rgba(21,34,56,.06)}
.qtitle{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.qtitle h2{font-size:16px;font-weight:800;margin:0;color:var(--navy)}
.refresh{background:var(--surface);border:1px solid var(--line2);color:var(--muted);border-radius:9px;padding:7px 12px;font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--dim);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:0 10px 10px;border-bottom:1px solid var(--line)}
td{padding:12px 10px;border-bottom:1px solid var(--line);color:var(--txt)}
td.asin{font-family:ui-monospace,Menlo,monospace;font-weight:700}
.badge{display:inline-block;font-size:11px;font-weight:800;padding:4px 9px;border-radius:7px}
.b-wait{background:#FEF3D0;color:#8a6a00}
.b-ok{background:#DCF5E9;color:#0F7A4E}
.b-err{background:#FBE0E0;color:#B23434}
.empty{color:var(--dim);text-align:center;padding:30px 0;font-size:13.5px}
</style>

<div class="wrap">
  <div class="top"><a class="back" href="fba.html">← Console FBA PREP IDF</a></div>
  <h1>Suivi des <span class="g">mises en ligne</span></h1>
  <div class="sub">Historique des ASIN ajoutés au catalogue : date, quantité et statut.</div>

  <div class="stats" id="stats"></div>

  <div class="card">
    <div class="qtitle">
      <h2>Détail</h2>
      <button class="refresh" id="refresh">↻ Rafraîchir</button>
    </div>
    <div id="tablewrap"><div class="empty">Chargement…</div></div>
  </div>
</div>

<script>
const QUEUE_PATH='mise-en-ligne-queue.json';
async function ghFetch(path){ return fetch(`/api/${path}`,{headers:{'Accept':'application/vnd.github.v3+json'}}); }
function b64utf8(b64){ const raw=atob((b64||'').replace(/\n/g,'')); const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0)); return new TextDecoder('utf-8').decode(bytes); }
async function loadQueue(){
  const r=await ghFetch(`contents/${QUEUE_PATH}`);
  if(r.status===404) return {entries:[]};
  if(!r.ok) throw new Error('Lecture échouée ('+r.status+')');
  const j=await r.json(); const d=JSON.parse(b64utf8(j.content)||'{"entries":[]}');
  if(!Array.isArray(d.entries)) d.entries=[]; return d;
}
function fmt(iso){ if(!iso) return '—'; const d=new Date(iso); return d.toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}); }
function badge(s){
  if(s==='en_ligne') return '<span class="badge b-ok">En ligne</span>';
  if(s==='erreur')   return '<span class="badge b-err">Erreur</span>';
  return '<span class="badge b-wait">En attente</span>';
}
async function render(){
  const wrap=document.getElementById('tablewrap'), stats=document.getElementById('stats');
  try{
    const d=await loadQueue();
    const n=d.entries.length;
    const ok=d.entries.filter(e=>e.statut==='en_ligne').length;
    const wait=d.entries.filter(e=>e.statut==='en_attente'||!e.statut).length;
    const err=d.entries.filter(e=>e.statut==='erreur').length;
    stats.innerHTML=
      `<div class="stat"><div class="n">${n}</div><div class="l">Total</div></div>`+
      `<div class="stat ok"><div class="n">${ok}</div><div class="l">En ligne</div></div>`+
      `<div class="stat wait"><div class="n">${wait}</div><div class="l">En attente</div></div>`+
      `<div class="stat err"><div class="n">${err}</div><div class="l">En erreur</div></div>`;
    const rows=[...d.entries].reverse();
    if(!rows.length){ wrap.innerHTML='<div class="empty">Aucune mise en ligne pour le moment.</div>'; return; }
    wrap.innerHTML='<table><thead><tr><th>ASIN</th><th>Canal</th><th>Qté</th><th>Ajouté le</th><th>Mis en ligne</th><th>Statut</th></tr></thead><tbody>'+
      rows.map(e=>`<tr><td class="asin">${e.asin}</td><td>${e.canal||'FBA'}</td><td>${e.quantite||'—'}</td><td>${fmt(e.ajouteLe)}</td><td>${fmt(e.traiteLe)}</td><td>${badge(e.statut)}</td></tr>`).join('')+
      '</tbody></table>';
  }catch(err){ wrap.innerHTML='<div class="empty">Impossible de charger : '+err.message+'</div>'; }
}
document.getElementById('refresh').addEventListener('click', render);
render(); setInterval(render, 20000);
</script>
</body>
</html>
